name: Publish release tag

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write
    id-token: write

concurrency:
    group: zynohosting-public-release
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm
        steps:
            - name: Check out the mirrored tag
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  package-manager-cache: false
                  registry-url: 'https://registry.npmjs.org'

            - name: Validate tag and metadata versions
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION="$(node -p "require('./package.json').version")"
                  test "${GITHUB_REF_NAME}" = "v${VERSION}"
                  node -e "const fs=require('node:fs'); const p=require('./package.json'); const s=JSON.parse(fs.readFileSync('server.json')); if (s.name !== p.mcpName || s.version !== p.version || s.packages?.[0]?.identifier !== p.name || s.packages?.[0]?.version !== p.version) process.exit(1);"

            - name: Install, test, and build
              shell: bash
              run: |
                  set -euo pipefail
                  corepack enable
                  yarn --immutable
                  yarn typecheck
                  yarn test
                  yarn build
                  yarn verify-package
                  npm pack --dry-run

            - name: Publish the public npm package
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION="$(node -p "require('./package.json').version")"
                  npm install --global "npm@^11.5.1"
                  if npm view "@zyno-io/zynohosting@${VERSION}" version >/dev/null 2>&1; then
                    echo "@zyno-io/zynohosting@${VERSION} is already published."
                  else
                    npm publish --access public
                  fi

            - name: Wait for npm package visibility
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION="$(node -p "require('./package.json').version")"
                  for attempt in {1..60}; do
                    if npm view "@zyno-io/zynohosting@${VERSION}" version >/dev/null 2>&1; then
                      exit 0
                    fi
                    sleep 10
                  done
                  echo "Published package did not become visible in time."
                  exit 1

            - name: Publish the stdio server to the MCP Registry
              shell: bash
              run: |
                  set -euo pipefail
                  curl --fail --location --output mcp-publisher.tar.gz \
                    "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz"
                  echo "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf  mcp-publisher.tar.gz" | sha256sum --check
                  tar xzf mcp-publisher.tar.gz mcp-publisher
                  NAME="$(node -p "require('./server.json').name")"
                  VERSION="$(node -p "require('./server.json').version")"
                  ENCODED_NAME="$(node -p "encodeURIComponent(process.argv[1])" "$NAME")"
                  STATUS="$(curl --silent --show-error --output registry-response.json --write-out "%{http_code}" \
                    "https://registry.modelcontextprotocol.io/v0.1/servers/${ENCODED_NAME}/versions/${VERSION}")"
                  if [ "$STATUS" = "200" ]; then
                    echo "${NAME}@${VERSION} is already published to the MCP Registry."
                  elif [ "$STATUS" = "404" ]; then
                    ./mcp-publisher login github-oidc
                    ./mcp-publisher publish
                  else
                    cat registry-response.json
                    echo "Unexpected MCP Registry response: HTTP ${STATUS}"
                    exit 1
                  fi

            - name: Fast-forward GitHub main to the released tag
              shell: bash
              run: |
                  set -euo pipefail
                  git fetch origin main:refs/remotes/origin/main || true
                  if git show-ref --verify --quiet refs/remotes/origin/main; then
                    git merge-base --is-ancestor refs/remotes/origin/main "${GITHUB_SHA}"
                  fi
                  git push origin "${GITHUB_SHA}:refs/heads/main"
