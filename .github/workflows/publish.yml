name: Publish release tag

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write
    id-token: write

concurrency:
    group: zynohosting-public-release
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Check out the mirrored tag
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  package-manager-cache: false
                  registry-url: 'https://registry.npmjs.org'

            - name: Validate tag and metadata versions
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION="$(node -p "require('./package.json').version")"
                  test "${GITHUB_REF_NAME}" = "v${VERSION}"
                  node -e "const fs=require('node:fs'); const p=require('./package.json'); const s=JSON.parse(fs.readFileSync('server.json')); if (s.name !== p.mcpName || s.version !== p.version || s.packages?.[0]?.identifier !== p.name || s.packages?.[0]?.version !== p.version) process.exit(1);"

            - name: Install, test, and build
              shell: bash
              run: |
                  set -euo pipefail
                  corepack enable
                  yarn --immutable
                  yarn typecheck
                  yarn test
                  yarn build
                  yarn verify-package
                  npm pack --dry-run

            - name: Build and sign the desktop extension
              id: desktop-extension
              shell: bash
              env:
                  MCPB_SIGN_KEY_B64: ${{ secrets.MCPB_SIGN_KEY_B64 }}
                  MCPB_SIGN_CERT_B64: ${{ secrets.MCPB_SIGN_CERT_B64 }}
                  # Optional, and only during a signing-key rotation: the outgoing
                  # certificate. The bundle is signed by the incoming key and new
                  # manual installs trust both; installed launchers cannot learn a
                  # new key because staged updates replace server.js only.
                  MCPB_TRUST_CERT_B64: ${{ secrets.MCPB_TRUST_CERT_B64 }}
              run: |
                  set -euo pipefail
                  SIGNING_DIR="$(mktemp -d)"
                  trap 'rm -rf "$SIGNING_DIR"' EXIT

                  # Missing secrets must not fail npm or registry publication.
                  # The unsigned build is verified locally but is never attached
                  # to a GitHub release under the canonical download names.
                  if [ -n "${MCPB_SIGN_KEY_B64}" ] && [ -n "${MCPB_SIGN_CERT_B64}" ]; then
                    printf '%s' "${MCPB_SIGN_KEY_B64}" | base64 -d > "${SIGNING_DIR}/key.pem"
                    printf '%s' "${MCPB_SIGN_CERT_B64}" | base64 -d > "${SIGNING_DIR}/cert.pem"
                    chmod 0600 "${SIGNING_DIR}/key.pem"
                    export MCPB_SIGN_KEY="${SIGNING_DIR}/key.pem"
                    export MCPB_SIGN_CERT="${SIGNING_DIR}/cert.pem"
                    if [ -n "${MCPB_TRUST_CERT_B64}" ]; then
                      printf '%s' "${MCPB_TRUST_CERT_B64}" | base64 -d > "${SIGNING_DIR}/trust.pem"
                      export MCPB_TRUSTED_CERTS="${SIGNING_DIR}/trust.pem"
                    fi
                  else
                    echo "::warning::MCPB signing secrets are not configured; skipping GitHub release assets."
                  fi

                  node scripts/build-mcpb.mjs
                  node scripts/verify-mcpb.mjs
                  if [ -f build/server.js.sig ]; then
                    echo "signed=true" >> "${GITHUB_OUTPUT}"
                  else
                    echo "signed=false" >> "${GITHUB_OUTPUT}"
                  fi

            - name: Attach the desktop extension to the release
              if: steps.desktop-extension.outputs.signed == 'true'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  VERSION="$(node -p "require('./package.json').version")"
                  TAG="v${VERSION}"
                  if ! gh release view "${TAG}" >/dev/null 2>&1; then
                    gh release create "${TAG}" --title "${TAG}" --generate-notes --latest
                  fi
                  # Installed bundles poll releases/latest/download/update.json, so the
                  # descriptor has to ride on the release marked latest, and --clobber
                  # keeps a re-run from failing on an asset that is already there.
                  # An unversioned copy as well, because releases/latest/download
                  # can only resolve a filename it knows in advance, and the
                  # documentation needs one link that never goes stale.
                  cp "build/zynohosting-${VERSION}.mcpb" build/zynohosting.mcpb

                  # server.js and its detached signature are what an already
                  # installed launcher stages; the .mcpb is for new installs.
                  ASSETS=("build/zynohosting-${VERSION}.mcpb" build/zynohosting.mcpb build/update.json build/server.js build/server.js.sig)

                  gh release upload "${TAG}" "${ASSETS[@]}" --clobber

            - name: Publish the public npm package
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION="$(node -p "require('./package.json').version")"
                  npm install --global "npm@^11.5.1"
                  if npm view "@zyno-io/zynohosting@${VERSION}" version >/dev/null 2>&1; then
                    echo "@zyno-io/zynohosting@${VERSION} is already published."
                  else
                    npm publish --access public
                  fi

            - name: Wait for npm package visibility
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION="$(node -p "require('./package.json').version")"
                  for attempt in {1..60}; do
                    if npm view "@zyno-io/zynohosting@${VERSION}" version >/dev/null 2>&1; then
                      exit 0
                    fi
                    sleep 10
                  done
                  echo "Published package did not become visible in time."
                  exit 1

            - name: Publish the stdio server to the MCP Registry
              shell: bash
              run: |
                  set -euo pipefail
                  curl --fail --location --output mcp-publisher.tar.gz \
                    "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz"
                  echo "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf  mcp-publisher.tar.gz" | sha256sum --check
                  tar xzf mcp-publisher.tar.gz mcp-publisher
                  NAME="$(node -p "require('./server.json').name")"
                  VERSION="$(node -p "require('./server.json').version")"
                  ENCODED_NAME="$(node -p "encodeURIComponent(process.argv[1])" "$NAME")"
                  STATUS="$(curl --silent --show-error --output registry-response.json --write-out "%{http_code}" \
                    "https://registry.modelcontextprotocol.io/v0.1/servers/${ENCODED_NAME}/versions/${VERSION}")"
                  if [ "$STATUS" = "200" ]; then
                    echo "${NAME}@${VERSION} is already published to the MCP Registry."
                  elif [ "$STATUS" = "404" ]; then
                    ./mcp-publisher login github-oidc
                    ./mcp-publisher publish
                  else
                    cat registry-response.json
                    echo "Unexpected MCP Registry response: HTTP ${STATUS}"
                    exit 1
                  fi

            - name: Fast-forward GitHub main to the released tag
              shell: bash
              run: |
                  set -euo pipefail
                  git fetch origin main:refs/remotes/origin/main || true
                  if git show-ref --verify --quiet refs/remotes/origin/main; then
                    git merge-base --is-ancestor refs/remotes/origin/main "${GITHUB_SHA}"
                  fi
                  git push origin "${GITHUB_SHA}:refs/heads/main"
