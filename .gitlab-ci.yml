image: node:24-alpine

variables:
    GIT_DEPTH: '0'
    GITHUB_MIRROR_REPOSITORY: 'zyno-io/zynohosting-cli'

default:
    interruptible: true
    before_script:
        - apk add --no-cache git
        - corepack enable

stages:
    - test
    - canary
    - release

test:
    stage: test
    rules:
        - if: '$CI_COMMIT_TAG'
          when: never
        - when: on_success
    script:
        - yarn --immutable
        - yarn typecheck
        - yarn test
        - yarn build
        - yarn docs:build
        - yarn verify-package
        - npm pack --dry-run

publish_canary:
    stage: canary
    needs:
        - test
    resource_group: zynohosting-internal-canary
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    script:
        - |
            set -eu
            : "${INTERNAL_NPM_REGISTRY:?INTERNAL_NPM_REGISTRY must be configured as a protected CI variable}"
            BASE_VERSION="$(node -p "require('./package.json').version.split(/[+-]/, 1)[0]")"
            CANARY_VERSION="${BASE_VERSION}-canary.${CI_PIPELINE_IID}.g${CI_COMMIT_SHORT_SHA}"
            PACKAGE_NAME="$(node -p "require('./package.json').name")"

            yarn --immutable
            npm version "${CANARY_VERSION}" --no-git-tag-version
            node -e "const fs=require('node:fs'); const version=process.argv[1]; const metadata=JSON.parse(fs.readFileSync('server.json')); metadata.version=version; metadata.packages[0].version=version; fs.writeFileSync('server.json', JSON.stringify(metadata, null, 4) + '\n');" "${CANARY_VERSION}"
            yarn build
            yarn verify-package

            REGISTRY_AUTH_KEY="$(node -e "const url=new URL(process.argv[1]); process.stdout.write('//'+url.host+url.pathname.replace(/\\/?$/, '/')+':_authToken');" "${INTERNAL_NPM_REGISTRY}")"
            npm config set -- "${REGISTRY_AUTH_KEY}=${PRIVATE_NPM_PUBLISHER_TOKEN}"
            if npm view "${PACKAGE_NAME}@${CANARY_VERSION}" version --registry "${INTERNAL_NPM_REGISTRY}" >/dev/null 2>&1; then
              echo "${PACKAGE_NAME}@${CANARY_VERSION} already exists; restoring the canary dist-tag."
              npm dist-tag add "${PACKAGE_NAME}@${CANARY_VERSION}" canary --registry "${INTERNAL_NPM_REGISTRY}"
            else
              npm publish --registry "${INTERNAL_NPM_REGISTRY}" --tag canary --access restricted
            fi

mirror_release_tag:
    stage: release
    needs:
        - test
        - publish_canary
    resource_group: zynohosting-public-release
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITHUB_MIRROR_SSH_KEY_B64'
    before_script:
        - apk add --no-cache curl git openssh-client
        - corepack enable
    script:
        - |
            set -eu
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
            PREVIOUS_VERSION=""
            if [ "${CI_COMMIT_BEFORE_SHA:-}" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "${CI_COMMIT_BEFORE_SHA}:package.json" 2>/dev/null; then
              PREVIOUS_VERSION="$(git show "${CI_COMMIT_BEFORE_SHA}:package.json" | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(value).version));")"
            fi
            node -e "const version=process.argv[1]; if (!/^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$/.test(version)) throw new Error('package version is not valid SemVer');" "$VERSION"
            yarn --immutable
            yarn build
            yarn verify-package

            SOURCE_TAG_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            if [ -n "$SOURCE_TAG_SHA" ] && [ -n "$PREVIOUS_VERSION" ] && [ "$VERSION" != "$PREVIOUS_VERSION" ] && [ "$SOURCE_TAG_SHA" != "$CI_COMMIT_SHA" ]; then
              echo "GitLab tag ${TAG} already points to ${SOURCE_TAG_SHA}, not ${CI_COMMIT_SHA}."
              exit 1
            fi
            if [ -z "$SOURCE_TAG_SHA" ]; then
              echo "Version ${VERSION} has no release tag yet; creating ${TAG} at ${CI_COMMIT_SHA}."
              git tag "${TAG}" "${CI_COMMIT_SHA}"
              git push origin "refs/tags/${TAG}:refs/tags/${TAG}"
              SOURCE_TAG_SHA="$CI_COMMIT_SHA"
            elif [ "$VERSION" = "$PREVIOUS_VERSION" ]; then
              echo "Version ${VERSION} is unchanged and already tagged; checking that the release tag was mirrored."
            fi

            install -d -m 0700 "${HOME}/.ssh"
            printf '%s' "${GITHUB_MIRROR_SSH_KEY_B64}" | base64 -d > "${HOME}/.ssh/zynohosting-mirror"
            printf '\n' >> "${HOME}/.ssh/zynohosting-mirror"
            chmod 0600 "${HOME}/.ssh/zynohosting-mirror"
            ssh-keygen -y -f "${HOME}/.ssh/zynohosting-mirror" >/dev/null
            curl --fail --silent --show-error https://api.github.com/meta | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => { const keys=JSON.parse(value).ssh_keys; if (!Array.isArray(keys) || !keys.length) throw new Error('GitHub did not publish SSH host keys'); process.stdout.write(keys.map(key => 'github.com ' + key).join('\\n') + '\\n'); });" > "${HOME}/.ssh/known_hosts"
            chmod 0600 "${HOME}/.ssh/known_hosts"
            GITHUB_SSH_COMMAND="ssh -i ${HOME}/.ssh/zynohosting-mirror -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${HOME}/.ssh/known_hosts"
            GITHUB_URL="git@github.com:${GITHUB_MIRROR_REPOSITORY}.git"
            GITHUB_TAG_SHA="$(GIT_SSH_COMMAND="$GITHUB_SSH_COMMAND" git ls-remote --tags "$GITHUB_URL" "refs/tags/${TAG}" | awk '{print $1}')"
            if [ -n "$GITHUB_TAG_SHA" ] && [ "$GITHUB_TAG_SHA" != "$SOURCE_TAG_SHA" ]; then
              echo "GitHub tag ${TAG} already points to ${GITHUB_TAG_SHA}, not ${SOURCE_TAG_SHA}."
              exit 1
            fi
            if [ -z "$GITHUB_TAG_SHA" ]; then
              git tag --force "$TAG" "$SOURCE_TAG_SHA"
              GIT_SSH_COMMAND="$GITHUB_SSH_COMMAND" git push "$GITHUB_URL" "refs/tags/${TAG}:refs/tags/${TAG}"
            fi
